services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragforge-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragforge}
      POSTGRES_DB: ${POSTGRES_DB:-ragforge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: ragforge-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ragforge}:${POSTGRES_PASSWORD:-ragforge}@postgres:5432/${POSTGRES_DB:-ragforge}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-ragforge}:${POSTGRES_PASSWORD:-ragforge}@postgres:5432/${POSTGRES_DB:-ragforge}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: ragforge-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
